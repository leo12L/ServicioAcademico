<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi panel — Maestro</title>
<style>
  :root {
    --azul: #1d4ed8;
    --azul-osc: #1e3a8a;
    --gris-osc: #111827;
    --gris-med: #4b5563;
    --gris-claro: #f3f4f6;
    --borde: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-claro);
    color: var(--gris-osc);
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--borde);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .titulo { font-weight: 700; color: var(--azul-osc); }
  header .usuario { font-size: 0.9rem; color: var(--gris-med); }
  header button {
    background: none;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  main {
    max-width: 1160px;
    margin: 32px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitulo { color: var(--gris-med); margin: 0 0 24px; }

  .grid-cursos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }

  .tarjeta {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .tarjeta:hover {
    box-shadow: 0 10px 24px -8px rgba(17, 24, 39, 0.18);
    transform: translateY(-2px);
  }

  .tarjeta .miniatura-wrap { position: relative; }
  .tarjeta .miniatura {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--gris-claro);
  }

  .tarjeta .cuerpo {
    padding: 14px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .tarjeta h3 { margin: 0; font-size: 1rem; line-height: 1.35; color: var(--azul-osc); }
  .tarjeta .descripcion {
    margin: 4px 0 0;
    color: var(--gris-med);
    font-size: 0.85rem;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tipo {
    position: absolute;
    top: 10px;
    left: 10px;
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
    background: #fff;
  }
  .tipo.CURSO_SUELTO { color: var(--azul); }
  .tipo.SECUNDARIA { color: #92400e; }
  .tipo.PREPA_ABIERTA { color: #6d28d9; }

  .vacio {
    text-align: center;
    color: var(--gris-med);
    padding: 40px 20px;
    background: #fff;
    border: 1px dashed var(--borde);
    border-radius: 12px;
  }
</style>
</head>
<body>

<header>
  <span class="titulo">Mi panel</span>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="usuario" id="nombre-usuario"></span>
    <button id="btn-salir">Cerrar sesión</button>
  </div>
</header>

<main>
  <h1>Mis cursos a cargo</h1>
  <p class="subtitulo">Cursos que impartes actualmente.</p>
  <div class="grid-cursos" id="lista-cursos"></div>
</main>

<script>
  const API_URL = "http://localhost:8080/api";
  const usuario = JSON.parse(localStorage.getItem("usuario") || "null");

  if (!usuario || usuario.rol !== "MAESTRO") {
    window.location.href = "login.html";
  } else {
    document.getElementById("nombre-usuario").textContent = usuario.nombreCompleto;

    document.getElementById("btn-salir").addEventListener("click", () => {
      localStorage.removeItem("usuario");
      window.location.href = "index.html";
    });

    fetch(`${API_URL}/cursos/maestro/${usuario.id}`)
      .then(r => r.json())
      .then(cursos => {
        const contenedor = document.getElementById("lista-cursos");
        if (cursos.length === 0) {
          contenedor.innerHTML = '<div class="vacio">Todavía no tienes cursos asignados.</div>';
          return;
        }
        contenedor.innerHTML = cursos.map(c => `
          <div class="tarjeta" data-curso-id="${c.id}">
            <div class="miniatura-wrap">
              <img class="miniatura" src="https://picsum.photos/seed/curso-${c.id}/400/225" alt="${c.nombre}">
              <span class="tipo ${c.tipo}">${c.tipo.replace("_", " ")}</span>
            </div>
            <div class="cuerpo">
              <h3>${c.nombre}</h3>
              <p class="descripcion">${c.descripcion || ""}</p>
            </div>
          </div>
        `).join("");

        contenedor.querySelectorAll(".tarjeta").forEach(el => {
          el.addEventListener("click", () => {
            window.location.href = `maestro-curso.html?cursoId=${el.dataset.cursoId}`;
          });
        });
      })
      .catch(() => {
        document.getElementById("lista-cursos").innerHTML = '<div class="vacio">No se pudo conectar con el servidor.</div>';
      });
  }
</script>

</body>
</html>
