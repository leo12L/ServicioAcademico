<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumnos y calificaciones — Maestro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #0012ff;
    --azul-osc: #000872;
    --azul-claro: #e8eaff;
    --dorado: #ffc300;
    --dorado-osc: #8a5a00;
    --dorado-claro: #fff6d9;
    --gris-osc: #16181f;
    --gris-med: #6b7280;
    --gris-claro: #f5f6fa;
    --borde: #e6e8f0;
    --verde: #16a34a;
    --verde-claro: #dcfce7;
    --rojo: #dc2626;
    --rojo-claro: #fee2e2;
    --radio-lg: 18px;
    --radio-xl: 26px;
    --radio-md: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-claro);
    color: var(--gris-osc);
  }
  .contenedor { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
  .icono { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .nav-flotante {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 20px;
    background: #fff;
    border-radius: 999px;
    padding: 8px 10px 8px 10px;
    box-shadow: 0 10px 30px -18px rgba(18,20,28,0.25);
  }
  .nav-izquierda { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .btn-volver {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: var(--gris-claro);
    color: var(--gris-osc);
  }
  .btn-volver:hover { background: var(--azul-claro); color: var(--azul); }
  .nombre-curso {
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--azul-osc);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 6px;
  }

  .nav-derecha { display: flex; align-items: center; gap: 14px; }
  .nav-derecha .usuario { font-size: 0.88rem; color: var(--gris-osc); font-weight: 600; }
  .nav-derecha button {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--azul-osc);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.84rem;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-derecha button:hover { background: var(--azul); }

  .subnav-wrap { margin-top: 16px; }
  .subnav {
    display: inline-flex;
    background: #fff;
    border-radius: 999px;
    padding: 5px;
    gap: 4px;
    box-shadow: 0 6px 18px -14px rgba(18,20,28,0.3);
  }
  .subnav a {
    padding: 9px 20px;
    color: var(--gris-med);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.86rem;
    border-radius: 999px;
  }
  .subnav a.activo { color: #fff; background: var(--azul-osc); }

  main { padding: 28px 0 60px; }
  h1 { font-size: 1.45rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitulo { color: var(--gris-med); margin: 0 0 20px; }
  h2.subseccion { font-size: 1.12rem; margin: 40px 0 14px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  h2.subseccion:first-of-type { margin-top: 0; }
  h2.subseccion .icono { color: var(--azul); width: 20px; height: 20px; }
  h2.subseccion .contador {
    background: var(--dorado-claro);
    color: var(--dorado-osc);
    font-size: 0.72rem;
    font-weight: 800;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .caja {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: var(--radio-lg);
    padding: 20px;
    margin-bottom: 14px;
  }

  /* ===== Cola de entregas pendientes de calificar ===== */
  .fila-pendiente {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 0;
    border-top: 1px solid var(--borde);
  }
  .fila-pendiente:first-child { border-top: none; padding-top: 0; }
  .info-pendiente { display: flex; align-items: center; gap: 12px; min-width: 220px; flex: 1; }
  .badge-tipo {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .badge-tipo.TAREA { background: var(--azul-claro); color: var(--azul); }
  .badge-tipo.EXAMEN { background: var(--rojo-claro); color: var(--rojo); }
  .titulo-pendiente { font-weight: 700; font-size: 0.92rem; }
  .meta-pendiente { color: var(--gris-med); font-size: 0.82rem; margin-top: 2px; }
  .meta-pendiente .antigua { color: var(--dorado-osc); font-weight: 700; }

  .acciones-pendiente { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .link-archivo {
    color: var(--azul);
    font-weight: 700;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 7px 4px;
  }
  .link-archivo .icono { width: 15px; height: 15px; }
  .calificacion-input {
    width: 68px;
    padding: 8px 10px;
    border: 1px solid var(--borde);
    border-radius: var(--radio-md);
    font-size: 0.88rem;
    text-align: center;
    font-family: inherit;
  }
  .calificacion-input:focus { outline: 2px solid var(--azul); outline-offset: 1px; }
  .btn-guardar-calif {
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: var(--radio-md);
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-guardar-calif:hover { background: var(--azul-osc); }
  .btn-guardar-calif:disabled { background: #b9c0ff; cursor: not-allowed; }

  .al-dia {
    text-align: center;
    color: var(--verde);
    padding: 30px 20px;
    background: var(--verde-claro);
    border-radius: var(--radio-lg);
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .al-dia .icono { width: 28px; height: 28px; }

  /* ===== Lista de alumnos ===== */
  .alumno-card { cursor: pointer; }
  .alumno-fila { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .alumno-fila .datos-alumno { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar-alumno {
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    background: var(--azul-claro);
    color: var(--azul-osc);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.9rem;
  }
  .alumno-fila .nombre { font-weight: 700; font-size: 0.95rem; }
  .avance-alumno { display: flex; align-items: center; gap: 10px; min-width: 160px; justify-content: flex-end; }
  .barra-avance-mini { width: 90px; height: 7px; border-radius: 999px; background: var(--gris-claro); overflow: hidden; }
  .barra-avance-mini .relleno { height: 100%; background: var(--verde); border-radius: 999px; transition: width .3s ease; }
  .porcentaje { color: var(--gris-osc); font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
  .icono-expandir { color: var(--gris-med); transition: transform .18s ease; }
  .alumno-card.abierto .icono-expandir { transform: rotate(180deg); }

  .detalle-alumno { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--borde); display: none; }
  .alumno-card.abierto .detalle-alumno { display: block; }
  .subseccion-alumno {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--gris-med);
    margin: 18px 0 2px;
  }
  .subseccion-alumno:first-child { margin-top: 0; }
  .tema-fila {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--borde);
    cursor: pointer;
    user-select: none;
  }
  .tema-fila .check {
    width: 20px;
    height: 20px;
    min-width: 20px;
    border-radius: 50%;
    border: 2px solid var(--borde);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tema-fila.completado .check { background: var(--verde); border-color: var(--verde); }
  .tema-fila .check svg { width: 12px; height: 12px; display: none; stroke: #fff; stroke-width: 3; }
  .tema-fila.completado .check svg { display: block; }
  .tema-fila span.titulo-tema { font-size: 0.92rem; }
  .tema-fila.completado span.titulo-tema { color: var(--gris-med); text-decoration: line-through; }

  .trabajo-fila {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--borde);
    flex-wrap: wrap;
  }
  .trabajo-fila .titulo-trabajo { font-size: 0.9rem; flex: 1; min-width: 140px; }
  .trabajo-fila .estado-entrega { font-size: 0.78rem; white-space: nowrap; padding: 3px 10px; border-radius: 999px; }
  .trabajo-fila .estado-entrega.entregado { color: var(--verde); font-weight: 700; background: var(--verde-claro); }
  .trabajo-fila .estado-entrega.sin-entregar { color: var(--gris-med); background: var(--gris-claro); }
  .trabajo-fila .calificacion-input { width: 60px; }
  .trabajo-fila .btn-guardar-calif { padding: 6px 12px; font-size: 0.76rem; }

  .vacio {
    text-align: center;
    color: var(--gris-med);
    padding: 30px 20px;
    background: #fff;
    border: 1px dashed var(--borde);
    border-radius: var(--radio-lg);
  }
</style>
</head>
<body>

<div class="contenedor">
  <nav class="nav-flotante">
    <div class="nav-izquierda">
      <a href="dashboard-maestro.html" class="btn-volver">
        <svg class="icono" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>
      <span class="nombre-curso" id="nombre-curso">Cargando...</span>
    </div>
    <div class="nav-derecha">
      <span class="usuario" id="nombre-usuario"></span>
      <button id="btn-salir">
        <svg class="icono" viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#fff"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Cerrar sesión
      </button>
    </div>
  </nav>
  <div class="subnav-wrap">
    <div class="subnav">
      <a id="tab-trabajos" href="#">Contenido</a>
      <a id="tab-alumnos" class="activo" href="#">Alumnos</a>
    </div>
  </div>
</div>

<main class="contenedor">
  <h1>Alumnos y calificaciones</h1>
  <p class="subtitulo" id="descripcion-curso"></p>

  <h2 class="subseccion">
    <svg class="icono" viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 17h6M9 13h3"/></svg>
    Entregas por calificar
    <span class="contador" id="contador-pendientes">0</span>
  </h2>
  <div class="caja" id="caja-pendientes">
    <div id="lista-pendientes"></div>
  </div>

  <h2 class="subseccion">
    <svg class="icono" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Alumnos inscritos
  </h2>
  <div id="lista-alumnos"></div>
</main>

<script>
  const API_URL = "http://localhost:8080/api";
  const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
  const params = new URLSearchParams(window.location.search);
  const cursoId = params.get("cursoId");

  if (!usuario || usuario.rol !== "MAESTRO") {
    window.location.href = "login.html";
  } else if (!cursoId) {
    window.location.href = "dashboard-maestro.html";
  } else {
    document.getElementById("nombre-usuario").textContent = usuario.nombreCompleto;
    document.getElementById("tab-trabajos").href = `maestro-curso.html?cursoId=${cursoId}`;
    document.getElementById("tab-alumnos").href = `maestro-curso-alumnos.html?cursoId=${cursoId}`;

    document.getElementById("btn-salir").addEventListener("click", () => {
      localStorage.removeItem("usuario");
      window.location.href = "index.html";
    });

    fetch(`${API_URL}/cursos/${cursoId}`)
      .then(r => r.json())
      .then(curso => {
        document.getElementById("nombre-curso").textContent = curso.nombre;
        document.getElementById("descripcion-curso").textContent = `Alumnos inscritos en ${curso.nombre}.`;
      });

    function iniciales(nombre) {
      return nombre.split(" ").filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join("");
    }

    function formatFecha(fechaISO) {
      const fecha = new Date(fechaISO);
      return fecha.toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "numeric" });
    }

    // ===== Cola de entregas pendientes de calificar (más antiguas primero) =====
    function cargarPendientes() {
      fetch(`${API_URL}/actividades/curso/${cursoId}`)
        .then(r => r.json())
        .then(actividades => Promise.all(actividades.map(a =>
          fetch(`${API_URL}/actividades/${a.id}/entregas`)
            .then(r => r.json())
            .then(entregas => entregas
              .filter(e => e.calificacion === null || e.calificacion === undefined)
              .map(e => ({ ...e, actividad: e.actividad || a })))
        )))
        .then(listas => {
          const pendientes = listas.flat().sort((a, b) => new Date(a.fechaEntrega) - new Date(b.fechaEntrega));
          pintarPendientes(pendientes);
        })
        .catch(() => {
          document.getElementById("lista-pendientes").innerHTML = '<div class="vacio">No se pudo conectar con el servidor.</div>';
        });
    }

    function pintarPendientes(pendientes) {
      document.getElementById("contador-pendientes").textContent = pendientes.length;
      const contenedor = document.getElementById("lista-pendientes");

      if (pendientes.length === 0) {
        contenedor.innerHTML = `<div class="al-dia">
          <svg class="icono" viewBox="0 0 24 24"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
          ¡Estás al día! No hay entregas pendientes de calificar.
        </div>`;
        return;
      }

      contenedor.innerHTML = pendientes.map((e, indice) => `
        <div class="fila-pendiente" data-entrega-id="${e.id}">
          <div class="info-pendiente">
            <span class="badge-tipo ${e.actividad.tipo}">${e.actividad.tipo}</span>
            <div>
              <div class="titulo-pendiente">${e.actividad.titulo}</div>
              <div class="meta-pendiente">${e.alumno.nombreCompleto} · entregó el ${formatFecha(e.fechaEntrega)}${indice === 0 ? ' · <span class="antigua">la más antigua</span>' : ""}</div>
            </div>
          </div>
          <div class="acciones-pendiente">
            <a class="link-archivo" href="${API_URL}/entregas/${e.id}/archivo" target="_blank" rel="noopener">
              <svg class="icono" viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/></svg>
              Ver archivo
            </a>
            <input type="number" step="0.1" min="0" max="10" class="calificacion-input" placeholder="Nota">
            <button type="button" class="btn-guardar-calif">Guardar</button>
          </div>
        </div>
      `).join("");

      contenedor.querySelectorAll(".fila-pendiente").forEach(fila => {
        const boton = fila.querySelector(".btn-guardar-calif");
        const input = fila.querySelector(".calificacion-input");
        boton.addEventListener("click", () => {
          const valor = input.value;
          if (valor === "") return;
          boton.disabled = true;
          fetch(`${API_URL}/entregas/${fila.dataset.entregaId}/calificar?calificacion=${valor}`, { method: "PATCH" })
            .then(r => r.json())
            .then(() => {
              cargarPendientes();
              cargarAlumnos();
            })
            .catch(() => {
              boton.disabled = false;
            });
        });
      });
    }

    // ===== Lista de alumnos =====
    function cargarAlumnos() {
      fetch(`${API_URL}/inscripciones/curso/${cursoId}`)
        .then(r => r.json())
        .then(inscripciones => {
          const contenedor = document.getElementById("lista-alumnos");
          if (inscripciones.length === 0) {
            contenedor.innerHTML = '<div class="vacio">Todavía no hay alumnos inscritos en este curso.</div>';
            return;
          }
          contenedor.innerHTML = inscripciones.map(i => `
            <div class="caja alumno-card" data-alumno-id="${i.alumno.id}">
              <div class="alumno-fila">
                <div class="datos-alumno">
                  <div class="avatar-alumno">${iniciales(i.alumno.nombreCompleto)}</div>
                  <span class="nombre">${i.alumno.nombreCompleto}</span>
                </div>
                <div class="avance-alumno">
                  <div class="barra-avance-mini"><div class="relleno" id="barra-${i.alumno.id}" style="width:0%"></div></div>
                  <span class="porcentaje" id="porcentaje-${i.alumno.id}">…</span>
                  <svg class="icono icono-expandir" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                </div>
              </div>
              <div class="detalle-alumno">
                <p class="subseccion-alumno">Avance de temas</p>
                <div class="temas-alumno" id="temas-${i.alumno.id}"></div>
                <p class="subseccion-alumno">Trabajos y calificaciones</p>
                <div class="trabajos-alumno" id="trabajos-${i.alumno.id}"></div>
              </div>
            </div>
          `).join("");

          inscripciones.forEach(i => {
            cargarAvanceAlumno(i.alumno.id);
            cargarTrabajosAlumno(i.alumno.id);
          });

          contenedor.querySelectorAll(".alumno-card").forEach(el => {
            el.querySelector(".alumno-fila").addEventListener("click", () => {
              el.classList.toggle("abierto");
            });
          });
        });
    }

    function cargarAvanceAlumno(alumnoId) {
      fetch(`${API_URL}/temas/avance?alumnoId=${alumnoId}&cursoId=${cursoId}`)
        .then(r => r.json())
        .then(avance => pintarAvanceAlumno(alumnoId, avance));
    }

    function pintarAvanceAlumno(alumnoId, avance) {
      document.getElementById(`porcentaje-${alumnoId}`).textContent = `${avance.porcentaje}%`;
      document.getElementById(`barra-${alumnoId}`).style.width = `${avance.porcentaje}%`;

      const contenedor = document.getElementById(`temas-${alumnoId}`);
      if (avance.temas.length === 0) {
        contenedor.innerHTML = '<p style="color:var(--gris-med); font-size:0.88rem;">Este curso todavía no tiene temas cargados.</p>';
        return;
      }
      contenedor.innerHTML = avance.temas.map(t => `
        <div class="tema-fila ${t.completado ? "completado" : ""}" data-tema-id="${t.id}">
          <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6 9 17l-5-5"/></svg></div>
          <span class="titulo-tema">${t.titulo}</span>
        </div>
      `).join("");

      contenedor.querySelectorAll(".tema-fila").forEach(el => {
        el.addEventListener("click", (evento) => {
          evento.stopPropagation();
          fetch(`${API_URL}/temas/${el.dataset.temaId}/completar?alumnoId=${alumnoId}`, { method: "PATCH" })
            .then(r => r.json())
            .then(nuevoAvance => pintarAvanceAlumno(alumnoId, nuevoAvance));
        });
      });
    }

    // ===== Trabajos y calificaciones =====
    function cargarTrabajosAlumno(alumnoId) {
      fetch(`${API_URL}/actividades/estado?alumnoId=${alumnoId}&cursoId=${cursoId}`)
        .then(r => r.json())
        .then(actividades => pintarTrabajosAlumno(alumnoId, actividades));
    }

    function pintarTrabajosAlumno(alumnoId, actividades) {
      const contenedor = document.getElementById(`trabajos-${alumnoId}`);
      if (actividades.length === 0) {
        contenedor.innerHTML = '<p style="color:var(--gris-med); font-size:0.88rem;">Todavía no hay tareas ni exámenes asignados.</p>';
        return;
      }
      contenedor.innerHTML = actividades.map(a => `
        <div class="trabajo-fila" data-entrega-id="${a.entregaId || ""}">
          <span class="badge-tipo ${a.tipo}">${a.tipo}</span>
          <span class="titulo-trabajo">${a.titulo}</span>
          ${a.entregado
            ? `<span class="estado-entrega entregado">Entregado</span>
               <input type="number" step="0.1" class="calificacion-input" value="${a.calificacion != null ? a.calificacion : ""}" placeholder="—">
               <button type="button" class="btn-guardar-calif">Guardar</button>`
            : `<span class="estado-entrega sin-entregar">Sin entregar</span>`}
        </div>
      `).join("");

      contenedor.querySelectorAll(".trabajo-fila").forEach(fila => {
        const boton = fila.querySelector(".btn-guardar-calif");
        if (!boton) return;
        boton.addEventListener("click", (evento) => {
          evento.stopPropagation();
          const entregaId = fila.dataset.entregaId;
          const input = fila.querySelector(".calificacion-input");
          const valor = input.value;
          if (valor === "") return;

          boton.disabled = true;
          fetch(`${API_URL}/entregas/${entregaId}/calificar?calificacion=${valor}`, { method: "PATCH" })
            .then(r => r.json())
            .then(() => {
              boton.textContent = "Guardado ✓";
              cargarPendientes();
              setTimeout(() => {
                boton.textContent = "Guardar";
                boton.disabled = false;
              }, 1500);
            })
            .catch(() => {
              boton.disabled = false;
            });
        });
      });
    }

    cargarPendientes();
    cargarAlumnos();
  }
</script>

</body>
</html>
