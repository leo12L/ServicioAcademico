<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabajos del curso</title>
<style>
  :root {
    --azul: #1d4ed8;
    --azul-osc: #1e3a8a;
    --gris-osc: #111827;
    --gris-med: #4b5563;
    --gris-claro: #f3f4f6;
    --borde: #e5e7eb;
    --verde: #16a34a;
    --rojo: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-claro);
    color: var(--gris-osc);
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--borde);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .izquierda { display: flex; align-items: center; gap: 16px; }
  header .volver { color: var(--gris-med); font-size: 0.85rem; text-decoration: none; }
  header .titulo { font-weight: 700; color: var(--azul-osc); }
  header .usuario { font-size: 0.9rem; color: var(--gris-med); }
  header button {
    background: none;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .subnav { background: #fff; border-bottom: 1px solid var(--borde); }
  .subnav-contenido {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    gap: 24px;
  }
  .subnav a {
    display: inline-block;
    padding: 14px 0;
    color: var(--gris-med);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    border-bottom: 2px solid transparent;
  }
  .subnav a.activo { color: var(--azul-osc); border-bottom-color: var(--azul); }

  main {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitulo { color: var(--gris-med); margin: 0 0 24px; }
  h2.subseccion { font-size: 1.1rem; margin: 36px 0 14px; }

  .caja {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
  }

  /* Editor de trabajo: hoja + vista previa lado a lado */
  .editor-trabajo {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: flex-start;
    margin-bottom: 24px;
  }

  .hoja {
    flex: 1.5;
    min-width: 300px;
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 4px;
    box-shadow: 0 1px 3px rgba(17,24,39,0.05), 0 16px 32px -18px rgba(17,24,39,0.22);
    padding: 40px 44px 32px;
  }

  .form-actividad { display: flex; flex-direction: column; gap: 16px; }
  .form-actividad select,
  .form-actividad input,
  .form-actividad textarea {
    width: 100%;
    font-family: inherit;
    border: none;
    background: transparent;
    padding: 0;
  }
  .form-actividad select#tipo {
    align-self: flex-start;
    background: var(--gris-claro);
    font-weight: 700;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 5px 12px;
    border-radius: 999px;
    color: var(--gris-med);
  }
  .form-actividad input#titulo {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--gris-osc);
    border-bottom: 2px solid var(--borde);
    padding-bottom: 8px;
  }
  .form-actividad input#titulo::placeholder { color: #c3c8d1; font-weight: 700; }
  .form-actividad input#titulo:focus { outline: none; border-bottom-color: var(--azul); }
  .form-actividad textarea#descripcion {
    min-height: 280px;
    resize: vertical;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1rem;
    line-height: 1.7;
    color: var(--gris-osc);
  }
  .form-actividad textarea#descripcion:focus { outline: none; }
  .form-actividad textarea#descripcion::placeholder { font-family: inherit; color: #b7bcc4; }
  .form-actividad button {
    align-self: flex-start;
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .vista-previa { flex: 1; min-width: 240px; position: sticky; top: 20px; }
  .etiqueta-preview {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--gris-med);
    margin: 0 0 10px;
  }
  .actividad-preview {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .actividad-preview h3 { margin: 8px 0 6px; font-size: 1rem; }
  .actividad-preview p {
    margin: 0 0 12px;
    color: var(--gris-med);
    font-size: 0.88rem;
    white-space: pre-wrap;
  }
  .actividad-preview .fila-entrega-preview {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--borde);
  }
  .actividad-preview .fila-entrega-preview input {
    font-size: 0.8rem;
    max-width: 130px;
    color: var(--gris-med);
  }
  .actividad-preview .fila-entrega-preview button {
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.8rem;
  }

  .actividad .encabezado { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .badge-tipo {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .badge-tipo.TAREA { background: #eff6ff; color: var(--azul); }
  .badge-tipo.EXAMEN { background: #fef2f2; color: var(--rojo); }
  .actividad h3 { margin: 0; font-size: 1rem; }
  .actividad p { margin: 4px 0 6px; color: var(--gris-med); font-size: 0.88rem; white-space: pre-wrap; }
  .actividad .entregas-count { font-size: 0.8rem; color: var(--gris-med); }

  .vacio {
    text-align: center;
    color: var(--gris-med);
    padding: 30px 20px;
    background: #fff;
    border: 1px dashed var(--borde);
    border-radius: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="izquierda">
    <a href="dashboard-maestro.html" class="volver">&larr; Mis cursos</a>
    <span class="titulo" id="nombre-curso">Cargando...</span>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="usuario" id="nombre-usuario"></span>
    <button id="btn-salir">Cerrar sesión</button>
  </div>
</header>

<div class="subnav">
  <div class="subnav-contenido">
    <a id="tab-trabajos" class="activo" href="#">Trabajos</a>
    <a id="tab-alumnos" href="#">Alumnos</a>
  </div>
</div>

<main>
  <h1 id="titulo-curso"></h1>
  <p class="subtitulo" id="descripcion-curso"></p>

  <h2 class="subseccion" style="margin-top:0;">Trabajos de la materia</h2>
  <div class="editor-trabajo">
    <div class="hoja">
      <form class="form-actividad" id="form-actividad">
        <select id="tipo" required>
          <option value="TAREA">Tarea</option>
          <option value="EXAMEN">Examen</option>
        </select>
        <input type="text" id="titulo" placeholder="Título del trabajo..." required>
        <textarea id="descripcion" placeholder="Escribe aquí las instrucciones completas: qué deben entregar, cómo, y cualquier detalle que necesiten los alumnos..."></textarea>
        <button type="submit">Asignar</button>
      </form>
    </div>

    <div class="vista-previa">
      <p class="etiqueta-preview">Así lo verá el alumno</p>
      <div class="actividad-preview">
        <span class="badge-tipo TAREA" id="preview-tipo">TAREA</span>
        <h3 id="preview-titulo">Título del trabajo</h3>
        <p id="preview-descripcion">Aquí aparecerá la descripción que escribas a la izquierda.</p>
        <div class="fila-entrega-preview">
          <input type="text" value="Elegir archivo" disabled>
          <button type="button" disabled>Entregar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="lista-actividades"></div>
</main>

<script>
  const API_URL = "http://localhost:8080/api";
  const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
  const params = new URLSearchParams(window.location.search);
  const cursoId = params.get("cursoId");

  if (!usuario || usuario.rol !== "MAESTRO") {
    window.location.href = "login.html";
  } else if (!cursoId) {
    window.location.href = "dashboard-maestro.html";
  } else {
    document.getElementById("nombre-usuario").textContent = usuario.nombreCompleto;
    document.getElementById("tab-trabajos").href = `maestro-curso.html?cursoId=${cursoId}`;
    document.getElementById("tab-alumnos").href = `maestro-curso-alumnos.html?cursoId=${cursoId}`;

    document.getElementById("btn-salir").addEventListener("click", () => {
      localStorage.removeItem("usuario");
      window.location.href = "index.html";
    });

    fetch(`${API_URL}/cursos/${cursoId}`)
      .then(r => r.json())
      .then(curso => {
        document.getElementById("nombre-curso").textContent = curso.nombre;
        document.getElementById("titulo-curso").textContent = curso.nombre;
        document.getElementById("descripcion-curso").textContent = curso.descripcion || "";
      });

    // ===== Actividades =====
    function cargarActividades() {
      fetch(`${API_URL}/actividades/curso/${cursoId}`)
        .then(r => r.json())
        .then(actividades => {
          const contenedor = document.getElementById("lista-actividades");
          if (actividades.length === 0) {
            contenedor.innerHTML = '<div class="vacio">Todavía no has asignado tareas ni exámenes.</div>';
            return;
          }
          contenedor.innerHTML = actividades.map(a => `
            <div class="caja actividad">
              <div class="encabezado">
                <span class="badge-tipo ${a.tipo}">${a.tipo}</span>
                <h3>${a.titulo}</h3>
              </div>
              <p>${a.descripcion || ""}</p>
              <span class="entregas-count" id="entregas-${a.id}">Consultando entregas...</span>
            </div>
          `).join("");

          actividades.forEach(a => {
            fetch(`${API_URL}/actividades/${a.id}/entregas`)
              .then(r => r.json())
              .then(entregas => {
                document.getElementById(`entregas-${a.id}`).textContent = `${entregas.length} entrega(s) recibida(s)`;
              });
          });
        });
    }

    document.getElementById("form-actividad").addEventListener("submit", (evento) => {
      evento.preventDefault();
      const datos = {
        curso: { id: cursoId },
        tipo: document.getElementById("tipo").value,
        titulo: document.getElementById("titulo").value,
        descripcion: document.getElementById("descripcion").value
      };
      fetch(`${API_URL}/actividades`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      })
        .then(r => r.json())
        .then(() => {
          document.getElementById("form-actividad").reset();
          actualizarVistaPrevia();
          cargarActividades();
        });
    });

    // ===== Vista previa en vivo =====
    function actualizarVistaPrevia() {
      const tipo = document.getElementById("tipo").value;
      const titulo = document.getElementById("titulo").value;
      const descripcion = document.getElementById("descripcion").value;

      const previewTipo = document.getElementById("preview-tipo");
      previewTipo.textContent = tipo;
      previewTipo.className = `badge-tipo ${tipo}`;

      document.getElementById("preview-titulo").textContent = titulo || "Título del trabajo";
      document.getElementById("preview-descripcion").textContent =
        descripcion || "Aquí aparecerá la descripción que escribas a la izquierda.";
    }

    ["tipo", "titulo", "descripcion"].forEach(id => {
      document.getElementById(id).addEventListener("input", actualizarVistaPrevia);
    });

    cargarActividades();
  }
</script>

</body>
</html>
