<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de cursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #0012ff;
    --azul-osc: #000872;
    --azul-claro: #e8eaff;
    --dorado: #ffc300;
    --dorado-claro: #fff6da;
    --gris-osc: #16181f;
    --gris-med: #6b7280;
    --gris-claro: #f5f6fa;
    --borde: #e6e8f0;
    --verde: #16a34a;
    --verde-claro: #dcfce7;
    --rojo: #dc2626;
    --rojo-claro: #fee2e2;
    --radio-xl: 26px;
    --radio-lg: 18px;
    --radio-md: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-claro);
    color: var(--gris-osc);
  }
  a { text-decoration: none; color: inherit; }
  .contenedor { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  .icono { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ===== NAV ===== */
  .franja-top { background: var(--gris-claro); padding: 20px 0 26px; }
  .nav-flotante {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    background: #fff;
    border-radius: 999px;
    padding: 8px 10px 8px 16px;
    box-shadow: 0 10px 30px -18px rgba(18,20,28,0.25);
  }
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca img { width: 32px; height: 32px; border-radius: 50%; display: block; }
  .marca-nombre { color: var(--azul-osc); font-weight: 700; font-size: 0.86rem; line-height: 1.15; }

  .nav-links { display: flex; gap: 22px; }
  .nav-links a { color: var(--gris-med); font-weight: 600; font-size: 0.88rem; padding: 6px 0; border-bottom: 2px solid transparent; }
  .nav-links a:hover { color: var(--azul-osc); }
  .nav-links a.activo { color: var(--azul-osc); border-bottom-color: var(--azul); }

  .nav-derecha { display: flex; align-items: center; gap: 12px; }
  .nav-derecha .usuario { font-size: 0.86rem; font-weight: 600; color: var(--gris-med); }
  .boton-salir {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--gris-claro);
    border: none;
    color: var(--gris-osc);
    padding: 9px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
  }
  .boton-salir:hover { background: var(--borde); }

  main { padding-bottom: 60px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .subtitulo { color: var(--gris-med); margin: 0 0 28px; }

  .grid-catalogo {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }

  .tarjeta {
    background: #fff;
    border-radius: var(--radio-lg);
    box-shadow: 0 10px 26px -20px rgba(18,20,28,0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .tarjeta:hover {
    box-shadow: 0 18px 36px -18px rgba(18,20,28,0.28);
    transform: translateY(-3px);
  }

  .tarjeta .miniatura-wrap { position: relative; }
  .tarjeta .miniatura {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--gris-claro);
  }
  .tarjeta .badge-tipo { position: absolute; top: 12px; left: 12px; }

  .tarjeta .cuerpo { padding: 16px 18px 8px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .tarjeta h3 { margin: 0; font-size: 1rem; line-height: 1.35; }
  .tarjeta .instructor { font-size: 0.78rem; color: var(--gris-med); font-weight: 600; }
  .tarjeta .descripcion {
    margin: 4px 0 0;
    color: var(--gris-med);
    font-size: 0.85rem;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .badge-tipo {
    display: inline-block;
    font-size: 0.66rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    background: #fff;
  }
  .badge-tipo.CURSO_SUELTO { color: var(--azul); }
  .badge-tipo.SECUNDARIA { color: #92720a; }
  .badge-tipo.PREPA_ABIERTA { color: var(--azul-osc); }

  .pie { padding: 12px 18px 18px; }
  .btn-inscribir {
    width: 100%;
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 11px 18px;
    border-radius: var(--radio-md);
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-inscribir:disabled { background: #b9c0ff; cursor: not-allowed; }
  .ya-inscrito {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--verde);
    background: var(--verde-claro);
    border-radius: var(--radio-md);
    padding: 11px;
  }
  .vacio {
    text-align: center;
    color: var(--gris-med);
    padding: 44px 24px;
    background: #fff;
    border: 1px dashed var(--borde);
    border-radius: var(--radio-lg);
  }

  @media (max-width: 640px) {
    .nav-links { display: none; }
    .marca-nombre { max-width: 150px; }
  }
</style>
</head>
<body>

<div class="franja-top">
  <div class="contenedor">
    <nav class="nav-flotante">
      <a href="dashboard-alumno.html" class="marca">
        <img src="assets/logo-instituto.png" alt="Instituto Chihuahuense de Excelencia Académica">
        <span class="marca-nombre">Instituto Chihuahuense<br>de Excelencia Académica</span>
      </a>
      <div class="nav-links">
        <a href="dashboard-alumno.html">Mis cursos</a>
        <a href="catalogo.html?tipo=sueltos" id="link-sueltos">Todos los cursos</a>
        <a href="catalogo.html?tipo=escuela" id="link-escuela">Escuela</a>
      </div>
      <div class="nav-derecha">
        <span class="usuario" id="nombre-usuario"></span>
        <button id="btn-salir" class="boton-salir">
          <svg class="icono" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Salir
        </button>
      </div>
    </nav>
  </div>
</div>

<main class="contenedor">
  <h1 id="titulo-pagina"></h1>
  <p class="subtitulo" id="subtitulo-pagina"></p>
  <div class="grid-catalogo" id="lista-catalogo"></div>
</main>

<script>
  const API_URL = "http://localhost:8080/api";
  const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
  const params = new URLSearchParams(window.location.search);
  const tipoVista = params.get("tipo") === "escuela" ? "escuela" : "sueltos";

  if (!usuario || usuario.rol !== "ALUMNO") {
    window.location.href = "login.html";
  } else {
    document.getElementById("nombre-usuario").textContent = usuario.nombreCompleto;

    document.getElementById("btn-salir").addEventListener("click", () => {
      localStorage.removeItem("usuario");
      window.location.href = "index.html";
    });

    if (tipoVista === "escuela") {
      document.getElementById("link-escuela").classList.add("activo");
      document.getElementById("titulo-pagina").textContent = "Escuela";
      document.getElementById("subtitulo-pagina").textContent = "Secundaria y prepa abierta que ofrece la academia.";
    } else {
      document.getElementById("link-sueltos").classList.add("activo");
      document.getElementById("titulo-pagina").textContent = "Todos los cursos";
      document.getElementById("subtitulo-pagina").textContent = "Cursos sueltos que ofrece la academia.";
    }

    let administradorTelefono = "";

    Promise.all([
      fetch(`${API_URL}/cursos`).then(r => r.json()),
      fetch(`${API_URL}/inscripciones/alumno/${usuario.id}`).then(r => r.json()),
      fetch(`${API_URL}/usuarios/administrador`).then(r => r.ok ? r.json() : null)
    ]).then(([cursos, inscripciones, administrador]) => {
      const idsInscritos = new Set(inscripciones.map(i => i.curso.id));
      administradorTelefono = administrador && administrador.telefono ? administrador.telefono : "";

      const cursosFiltrados = cursos.filter(c => {
        if (tipoVista === "escuela") {
          return c.tipo === "SECUNDARIA" || c.tipo === "PREPA_ABIERTA";
        }
        return c.tipo === "CURSO_SUELTO";
      });

      pintarCatalogo(cursosFiltrados, idsInscritos);
    }).catch(() => {
      document.getElementById("lista-catalogo").innerHTML = '<div class="vacio">No se pudo conectar con el servidor.</div>';
    });

    function pintarCatalogo(cursos, idsInscritos) {
      const contenedor = document.getElementById("lista-catalogo");
      if (cursos.length === 0) {
        contenedor.innerHTML = '<div class="vacio">Todavía no hay cursos cargados aquí.</div>';
        return;
      }
      contenedor.innerHTML = cursos.map(c => {
        const inscrito = idsInscritos.has(c.id);
        const nombreMaestro = c.maestro && c.maestro.nombreCompleto ? c.maestro.nombreCompleto : "Por asignar";
        return `
          <div class="tarjeta">
            <div class="miniatura-wrap">
              <img class="miniatura" src="https://picsum.photos/seed/curso-${c.id}/400/225" alt="${c.nombre}">
              <span class="badge-tipo ${c.tipo}">${c.tipo.replace("_", " ")}</span>
            </div>
            <div class="cuerpo">
              <h3>${c.nombre}</h3>
              <span class="instructor">${nombreMaestro}</span>
              <p class="descripcion">${c.descripcion || ""}</p>
            </div>
            <div class="pie">
              ${inscrito
                ? `<span class="ya-inscrito"><svg class="icono" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M20 6 9 17l-5-5"/></svg> Ya inscrito</span>`
                : `<button class="btn-inscribir" data-curso-id="${c.id}" data-curso-nombre="${c.nombre}">Inscribirme</button>`}
            </div>
          </div>
        `;
      }).join("");

      contenedor.querySelectorAll(".btn-inscribir").forEach(boton => {
        boton.addEventListener("click", () => inscribirme(boton));
      });
    }

    function inscribirme(boton) {
      const cursoId = boton.dataset.cursoId;
      const cursoNombre = boton.dataset.cursoNombre;
      boton.disabled = true;
      boton.textContent = "Inscribiendo...";

      fetch(`${API_URL}/inscripciones`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alumno: { id: usuario.id }, curso: { id: cursoId } })
      })
        .then(r => {
          if (!r.ok) throw new Error("No se pudo inscribir.");
          return r.json();
        })
        .then(() => {
          const tarjeta = boton.closest(".tarjeta");
          tarjeta.querySelector(".pie").innerHTML = `<span class="ya-inscrito"><svg class="icono" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M20 6 9 17l-5-5"/></svg> Ya inscrito</span>`;

          if (administradorTelefono) {
            const mensaje = `Hola, soy ${usuario.nombreCompleto} y quiero inscribirme al curso "${cursoNombre}".`;
            const urlWhatsapp = `https://wa.me/${administradorTelefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsapp, "_blank");
          }
        })
        .catch(() => {
          boton.disabled = false;
          boton.textContent = "Inscribirme";
        });
    }
  }
</script>

</body>
</html>
