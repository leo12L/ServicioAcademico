<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de cursos</title>
<style>
  :root {
    --azul: #1d4ed8;
    --azul-osc: #1e3a8a;
    --gris-osc: #111827;
    --gris-med: #4b5563;
    --gris-claro: #f3f4f6;
    --borde: #e5e7eb;
    --verde: #16a34a;
    --rojo: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-claro);
    color: var(--gris-osc);
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--borde);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .izquierda { display: flex; align-items: center; gap: 28px; }
  header .titulo { font-weight: 700; color: var(--azul-osc); }
  header .usuario { font-size: 0.9rem; color: var(--gris-med); }
  header button {
    background: none;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  nav.menu { display: flex; gap: 22px; }
  nav.menu a {
    color: var(--gris-med);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
  }
  nav.menu a.activo { color: var(--azul-osc); border-bottom-color: var(--azul); }
  main {
    max-width: 1160px;
    margin: 32px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitulo { color: var(--gris-med); margin: 0 0 24px; }

  .grid-catalogo {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }

  .tarjeta {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .tarjeta:hover {
    box-shadow: 0 10px 24px -8px rgba(17, 24, 39, 0.18);
    transform: translateY(-2px);
  }

  .tarjeta .miniatura-wrap { position: relative; }
  .tarjeta .miniatura {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--gris-claro);
  }
  .tarjeta .badge-tipo {
    position: absolute;
    top: 10px;
    left: 10px;
  }

  .tarjeta .cuerpo {
    padding: 14px 16px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .tarjeta h3 {
    margin: 0;
    font-size: 1rem;
    line-height: 1.35;
    color: var(--gris-osc);
  }
  .tarjeta .instructor {
    font-size: 0.78rem;
    color: var(--gris-med);
  }
  .tarjeta .descripcion {
    margin: 4px 0 0;
    color: var(--gris-med);
    font-size: 0.85rem;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .badge-tipo {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
    background: #fff;
  }
  .badge-tipo.CURSO_SUELTO { color: var(--azul); }
  .badge-tipo.SECUNDARIA { color: #92400e; }
  .badge-tipo.PREPA_ABIERTA { color: #6d28d9; }

  .pie { padding: 10px 16px 16px; }
  .btn-inscribir {
    width: 100%;
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .btn-inscribir:disabled { background: #93c5fd; cursor: not-allowed; }
  .ya-inscrito {
    display: block;
    text-align: center;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--verde);
    background: #f0fdf4;
    border-radius: 8px;
    padding: 10px;
  }
  .vacio {
    text-align: center;
    color: var(--gris-med);
    padding: 40px 20px;
    background: #fff;
    border: 1px dashed var(--borde);
    border-radius: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="izquierda">
    <span class="titulo">Mi panel</span>
    <nav class="menu">
      <a href="dashboard-alumno.html">Mis cursos</a>
      <a href="catalogo.html?tipo=sueltos" id="link-sueltos">Todos los cursos</a>
      <a href="catalogo.html?tipo=escuela" id="link-escuela">Escuela</a>
    </nav>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="usuario" id="nombre-usuario"></span>
    <button id="btn-salir">Cerrar sesión</button>
  </div>
</header>

<main>
  <h1 id="titulo-pagina"></h1>
  <p class="subtitulo" id="subtitulo-pagina"></p>
  <div class="grid-catalogo" id="lista-catalogo"></div>
</main>

<script>
  const API_URL = "http://localhost:8080/api";
  const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
  const params = new URLSearchParams(window.location.search);
  const tipoVista = params.get("tipo") === "escuela" ? "escuela" : "sueltos";

  if (!usuario || usuario.rol !== "ALUMNO") {
    window.location.href = "login.html";
  } else {
    document.getElementById("nombre-usuario").textContent = usuario.nombreCompleto;

    document.getElementById("btn-salir").addEventListener("click", () => {
      localStorage.removeItem("usuario");
      window.location.href = "index.html";
    });

    if (tipoVista === "escuela") {
      document.getElementById("link-escuela").classList.add("activo");
      document.getElementById("titulo-pagina").textContent = "Escuela";
      document.getElementById("subtitulo-pagina").textContent = "Secundaria y prepa abierta que ofrece la academia.";
    } else {
      document.getElementById("link-sueltos").classList.add("activo");
      document.getElementById("titulo-pagina").textContent = "Todos los cursos";
      document.getElementById("subtitulo-pagina").textContent = "Cursos sueltos que ofrece la academia.";
    }

    let administradorTelefono = "";

    Promise.all([
      fetch(`${API_URL}/cursos`).then(r => r.json()),
      fetch(`${API_URL}/inscripciones/alumno/${usuario.id}`).then(r => r.json()),
      fetch(`${API_URL}/usuarios/administrador`).then(r => r.ok ? r.json() : null)
    ]).then(([cursos, inscripciones, administrador]) => {
      const idsInscritos = new Set(inscripciones.map(i => i.curso.id));
      administradorTelefono = administrador && administrador.telefono ? administrador.telefono : "";

      const cursosFiltrados = cursos.filter(c => {
        if (tipoVista === "escuela") {
          return c.tipo === "SECUNDARIA" || c.tipo === "PREPA_ABIERTA";
        }
        return c.tipo === "CURSO_SUELTO";
      });

      pintarCatalogo(cursosFiltrados, idsInscritos);
    }).catch(() => {
      document.getElementById("lista-catalogo").innerHTML = '<div class="vacio">No se pudo conectar con el servidor.</div>';
    });

    function pintarCatalogo(cursos, idsInscritos) {
      const contenedor = document.getElementById("lista-catalogo");
      if (cursos.length === 0) {
        contenedor.innerHTML = '<div class="vacio">Todavía no hay cursos cargados aquí.</div>';
        return;
      }
      contenedor.innerHTML = cursos.map(c => {
        const inscrito = idsInscritos.has(c.id);
        const nombreMaestro = c.maestro && c.maestro.nombreCompleto ? c.maestro.nombreCompleto : "Por asignar";
        return `
          <div class="tarjeta">
            <div class="miniatura-wrap">
              <img class="miniatura" src="https://picsum.photos/seed/curso-${c.id}/400/225" alt="${c.nombre}">
              <span class="badge-tipo ${c.tipo}">${c.tipo.replace("_", " ")}</span>
            </div>
            <div class="cuerpo">
              <h3>${c.nombre}</h3>
              <span class="instructor">${nombreMaestro}</span>
              <p class="descripcion">${c.descripcion || ""}</p>
            </div>
            <div class="pie">
              ${inscrito
                ? `<span class="ya-inscrito">✓ Ya inscrito</span>`
                : `<button class="btn-inscribir" data-curso-id="${c.id}" data-curso-nombre="${c.nombre}">Inscribirme</button>`}
            </div>
          </div>
        `;
      }).join("");

      contenedor.querySelectorAll(".btn-inscribir").forEach(boton => {
        boton.addEventListener("click", () => inscribirme(boton));
      });
    }

    function inscribirme(boton) {
      const cursoId = boton.dataset.cursoId;
      const cursoNombre = boton.dataset.cursoNombre;
      boton.disabled = true;
      boton.textContent = "Inscribiendo...";

      fetch(`${API_URL}/inscripciones`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alumno: { id: usuario.id }, curso: { id: cursoId } })
      })
        .then(r => {
          if (!r.ok) throw new Error("No se pudo inscribir.");
          return r.json();
        })
        .then(() => {
          const tarjeta = boton.closest(".tarjeta");
          tarjeta.querySelector(".pie").innerHTML = `<span class="ya-inscrito">✓ Ya inscrito</span>`;

          if (administradorTelefono) {
            const mensaje = `Hola, soy ${usuario.nombreCompleto} y quiero inscribirme al curso "${cursoNombre}".`;
            const urlWhatsapp = `https://wa.me/${administradorTelefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(urlWhatsapp, "_blank");
          }
        })
        .catch(() => {
          boton.disabled = false;
          boton.textContent = "Inscribirme";
        });
    }
  }
</script>

</body>
</html>
