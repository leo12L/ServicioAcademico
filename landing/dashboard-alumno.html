<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi panel — Alumno</title>
<style>
  :root {
    --azul: #1d4ed8;
    --azul-osc: #1e3a8a;
    --gris-osc: #111827;
    --gris-med: #4b5563;
    --gris-claro: #f3f4f6;
    --borde: #e5e7eb;
    --verde: #16a34a;
    --rojo: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-claro);
    color: var(--gris-osc);
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--borde);
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header .titulo { font-weight: 700; color: var(--azul-osc); }
  header .usuario { font-size: 0.9rem; color: var(--gris-med); }
  header button {
    background: none;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  header .izquierda { display: flex; align-items: center; gap: 28px; }
  nav.menu { display: flex; gap: 22px; }
  nav.menu a {
    color: var(--gris-med);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
  }
  nav.menu a.activo { color: var(--azul-osc); border-bottom-color: var(--azul); }
  main {
    width: 97%;
    max-width: none;
    margin: 32px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2.subseccion { font-size: 1.1rem; margin: 0 0 14px; }
  .subtitulo { color: var(--gris-med); margin: 0 0 24px; }
  .grid-cursos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }
  .tarjeta {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .tarjeta:hover {
    box-shadow: 0 10px 24px -8px rgba(17, 24, 39, 0.18);
    transform: translateY(-2px);
  }
  .tarjeta .miniatura-wrap { position: relative; }
  .tarjeta .miniatura {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--gris-claro);
  }
  .tarjeta .cuerpo {
    padding: 14px 16px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .tarjeta h3 { margin: 0; font-size: 1rem; line-height: 1.35; }
  .tarjeta .descripcion {
    margin: 4px 0 0;
    color: var(--gris-med);
    font-size: 0.85rem;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .progreso-mini { display: flex; align-items: center; gap: 10px; padding: 10px 16px 16px; }
  .barra-fondo-mini {
    flex: 1;
    background: var(--gris-claro);
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
  }
  .barra-relleno-mini {
    background: var(--verde);
    height: 100%;
    border-radius: 999px;
    transition: width .25s ease;
  }
  .texto-mini {
    font-size: 0.78rem;
    color: var(--gris-med);
    min-width: 70px;
    text-align: right;
  }
  .etiqueta {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .etiqueta.ACTIVA { background: #dcfce7; color: var(--verde); }
  .etiqueta.FINALIZADA { background: #dbeafe; color: var(--azul-osc); }
  .etiqueta.CANCELADA { background: #fee2e2; color: #dc2626; }
  .vacio {
    text-align: center;
    color: var(--gris-med);
    padding: 40px 20px;
    background: #fff;
    border: 1px dashed var(--borde);
    border-radius: 12px;
  }

  .actividad-general {
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  .actividad-general:hover { border-color: var(--azul); }
  .actividad-general .encabezado {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .badge-tipo {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .badge-tipo.TAREA { background: #eff6ff; color: var(--azul); }
  .badge-tipo.EXAMEN { background: #fef2f2; color: var(--rojo); }
  .actividad-general .curso-nombre {
    font-size: 0.75rem;
    color: var(--gris-med);
    font-weight: 600;
  }
  .actividad-general h3 { margin: 0 0 4px; font-size: 0.95rem; }
  .actividad-general p { margin: 0; color: var(--gris-med); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <div class="izquierda">
    <span class="titulo">Mi panel</span>
    <nav class="menu">
      <a href="dashboard-alumno.html" class="activo">Mis cursos</a>
      <a href="catalogo.html?tipo=sueltos">Todos los cursos</a>
      <a href="catalogo.html?tipo=escuela">Escuela</a>
    </nav>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <span class="usuario" id="nombre-usuario"></span>
    <button id="btn-salir">Cerrar sesión</button>
  </div>
</header>

<main>
  <div class="columna-principal">
    <h1>Mis cursos</h1>
    <p class="subtitulo">Cursos en los que estás inscrito.</p>
    <div class="grid-cursos" id="lista-cursos"></div>
  </div>

  <aside class="columna-lateral">
    <h2 class="subseccion">Pendientes (todas las materias)</h2>
    <div id="lista-pendientes-generales"></div>
  </aside>
</main>

<script>
  const API_URL = "http://localhost:8080/api";
  const usuario = JSON.parse(localStorage.getItem("usuario") || "null");

  if (!usuario || usuario.rol !== "ALUMNO") {
    window.location.href = "login.html";
  } else {
    document.getElementById("nombre-usuario").textContent = usuario.nombreCompleto;

    document.getElementById("btn-salir").addEventListener("click", () => {
      localStorage.removeItem("usuario");
      window.location.href = "index.html";
    });

    function pintarGrupoCursos(contenedorId, inscripciones, mensajeVacio) {
      const contenedor = document.getElementById(contenedorId);
      if (inscripciones.length === 0) {
        contenedor.innerHTML = `<div class="vacio">${mensajeVacio}</div>`;
        return;
      }
      contenedor.innerHTML = inscripciones.map(i => `
        <div class="tarjeta" data-curso-id="${i.curso.id}">
          <div class="miniatura-wrap">
            <img class="miniatura" src="https://picsum.photos/seed/curso-${i.curso.id}/400/225" alt="${i.curso.nombre}">
            <span class="etiqueta ${i.estado}">${i.estado}</span>
          </div>
          <div class="cuerpo">
            <h3>${i.curso.nombre}</h3>
            <p class="descripcion">${i.curso.descripcion || ""}</p>
          </div>
          <div class="progreso-mini">
            <div class="barra-fondo-mini"><div class="barra-relleno-mini" id="barra-${i.curso.id}" style="width:0%"></div></div>
            <span class="texto-mini" id="texto-${i.curso.id}">...</span>
          </div>
        </div>
      `).join("");

      contenedor.querySelectorAll(".tarjeta").forEach(el => {
        el.addEventListener("click", () => {
          window.location.href = `curso.html?cursoId=${el.dataset.cursoId}`;
        });
      });

      inscripciones.forEach(i => {
        fetch(`${API_URL}/temas/avance?alumnoId=${usuario.id}&cursoId=${i.curso.id}`)
          .then(r => r.json())
          .then(avance => {
            document.getElementById(`barra-${i.curso.id}`).style.width = `${avance.porcentaje}%`;
            document.getElementById(`texto-${i.curso.id}`).textContent = `${avance.porcentaje}% (${avance.completados}/${avance.total})`;
          })
          .catch(() => {
            document.getElementById(`texto-${i.curso.id}`).textContent = "Sin datos";
          });
      });
    }

    fetch(`${API_URL}/inscripciones/alumno/${usuario.id}`)
      .then(r => r.json())
      .then(inscripciones => {
        pintarGrupoCursos("lista-cursos", inscripciones, "Todavía no tienes cursos. Ve a \"Todos los cursos\" o \"Escuela\" para inscribirte.");
      })
      .catch(() => {
        document.getElementById("lista-cursos").innerHTML = '<div class="vacio">No se pudo conectar con el servidor.</div>';
      });

    fetch(`${API_URL}/actividades/pendientes/alumno/${usuario.id}`)
      .then(r => r.json())
      .then(pendientes => {
        const contenedor = document.getElementById("lista-pendientes-generales");
        if (pendientes.length === 0) {
          contenedor.innerHTML = '<div class="vacio">No tienes tareas ni exámenes pendientes.</div>';
          return;
        }
        contenedor.innerHTML = pendientes.map(a => `
          <div class="actividad-general" data-curso-id="${a.curso.id}">
            <div class="encabezado">
              <span class="badge-tipo ${a.tipo}">${a.tipo}</span>
              <span class="curso-nombre">${a.curso.nombre}</span>
            </div>
            <h3>${a.titulo}</h3>
            <p>${a.descripcion || ""}</p>
          </div>
        `).join("");

        contenedor.querySelectorAll(".actividad-general").forEach(el => {
          el.addEventListener("click", () => {
            window.location.href = `curso.html?cursoId=${el.dataset.cursoId}`;
          });
        });
      })
      .catch(() => {
        document.getElementById("lista-pendientes-generales").innerHTML = '<div class="vacio">No se pudo conectar con el servidor.</div>';
      });
  }
</script>

</body>
</html>
